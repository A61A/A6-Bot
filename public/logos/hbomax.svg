<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="hbo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B048F"/>
      <stop offset="100%" stop-color="#6B46C1"/>
    </linearGradient>
    <filter id="hbo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#hbo-bg)"/>
  <text x="100" y="118" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" letter-spacing="2" fill="#fff" text-anchor="middle" filter="url(#hbo-glow)">HBO</text>
  <text x="100" y="155" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="1" fill="#fff" text-anchor="middle" filter="url(#hbo-glow)" opacity="0.9">MAX</text>
</svg>