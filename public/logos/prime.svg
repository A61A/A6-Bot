<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="prime-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <filter id="prime-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="200" rx="20" fill="url(#prime-bg)"/>
  <!-- Prime wordmark -->
  <text x="200" y="105" font-family="Amazon Ember, Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-1" fill="#00A8E1" text-anchor="middle" filter="url(#prime-glow)">Prime</text>
  <!-- Smile arrow -->
  <path d="M100 145 Q200 95 300 145" stroke="#FF9900" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#prime-glow)" opacity="0.95"/>
  <!-- Video text -->
  <text x="200" y="165" font-family="Amazon Ember, Arial, Helvetica, sans-serif" font-size="28" font-weight="500" letter-spacing="0.5" fill="#fff" text-anchor="middle" filter="url(#prime-glow)" opacity="0.85">Video</text>
</svg>